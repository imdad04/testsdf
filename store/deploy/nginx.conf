# Replace your.domain with the real one before running.
# certs go in /opt/buta-store/deploy/certs (mounted readonly into the container).

upstream backend_up { server backend:8000; }
upstream webapp_up  { server webapp:80; }

server {
    listen 80;
    server_name your.domain;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your.domain;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /webhooks/ {
        proxy_pass http://backend_up;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://backend_up;
    }

    location / {
        proxy_pass http://webapp_up;
        proxy_set_header Host $host;
    }
}
